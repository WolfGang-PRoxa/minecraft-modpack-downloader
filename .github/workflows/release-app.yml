# Construit l'installeur Windows et le publie dans une release quand un tag app-vX.Y.Z est poussé.
name: Publier l'application

on:
  push:
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Vérifier que le tag correspond à package.json
        id: version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#app-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Le tag ($TAG_VERSION) ne correspond pas à la version de package.json ($PKG_VERSION)."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npm run build:win

      - uses: softprops/action-gh-release@v2
        with:
          name: Modpack Downloader ${{ steps.version.outputs.version }}
          files: dist/Modpack-Downloader-Setup-*.exe
          make_latest: true
          body: |
            Télécharge **Modpack-Downloader-Setup-${{ steps.version.outputs.version }}.exe** ci-dessous et lance-le.

            Windows peut afficher « Windows a protégé votre ordinateur » : clique sur **Informations complémentaires**, puis **Exécuter quand même**.
