appId: com.wolfgangproxa.modpackdownloader
productName: Modpack Downloader
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack: []
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: Modpack-Downloader-Setup-${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  # Le raccourci du bureau est proposé par l'application elle-même (bureau ou autre emplacement).
  createDesktopShortcut: false
  include: build/installer.nsh
  createStartMenuShortcut: true
  shortcutName: Modpack Downloader
  runAfterFinish: true
  deleteAppDataOnUninstall: false
publish: null
